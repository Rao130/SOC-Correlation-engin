version: '3.9'

# =============================================================================
# SOC CORRELATION ENGINE - DOCKER COMPOSE
# Clean, working configuration for SOC system
# =============================================================================

services:
  # ===========================================================================
  # CORE APPLICATION - SOC Engine
  # ===========================================================================
  soc-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soc-engine
    restart: unless-stopped
    
    ports:
      - "8000:8000"
    
    environment:
      APP_NAME: "SOC Correlation Engine"
      VERSION: "2.0.0"
      DEBUG: "${DEBUG:-False}"
      SECRET_KEY: "${SECRET_KEY:-your-secret-key-here}"
      MONGODB_URL: "mongodb://admin:${MONGO_PASSWORD:-admin123}@mongodb:27017/soc_correlation_engine?authSource=admin"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-admin123}@redis:6379/0"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:8000,http://localhost:3000}"
    
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./data:/app/data
      - ./static:/app/static
    
    networks:
      - soc-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ===========================================================================
  # DATABASE - MongoDB
  # ===========================================================================
  mongodb:
    image: mongo:7.0
    container_name: soc-mongodb
    restart: unless-stopped
    
    ports:
      - "27017:27017"
    
    environment:
      MONGO_INITDB_ROOT_USERNAME: "admin"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD:-admin123}"
      MONGO_INITDB_DATABASE: "soc_correlation_engine"
    
    volumes:
      - mongodb_data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d
    
    networks:
      - soc-network
    
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    command: mongod --auth
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ===========================================================================
  # CACHE - Redis
  # ===========================================================================
  redis:
    image: redis:7.0-alpine
    container_name: soc-redis
    restart: unless-stopped
    
    ports:
      - "6379:6379"
    
    volumes:
      - redis_data:/data
    
    networks:
      - soc-network
    
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-admin123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    command: redis-server --requirepass ${REDIS_PASSWORD:-admin123} --appendonly yes
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ===========================================================================
  # MONITORING - Prometheus
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: soc-prometheus
    restart: unless-stopped
    
    ports:
      - "9090:9090"
    
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    
    networks:
      - soc-network
    
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ===========================================================================
  # VISUALIZATION - Grafana
  # ===========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: soc-grafana
    restart: unless-stopped
    
    ports:
      - "3001:3000"
    
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin123}"
      GF_SECURITY_ADMIN_USER: "admin"
      GF_INSTALL_PLUGINS: "grafana-clock-panel,grafana-simple-json-datasource"
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    
    networks:
      - soc-network
    
    depends_on:
      - prometheus
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ===========================================================================
  # LOGGING - Elasticsearch
  # ===========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: soc-elasticsearch
    restart: unless-stopped
    
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    
    networks:
      - soc-network
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ===========================================================================
  # LOG VISUALIZATION - Kibana
  # ===========================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: soc-kibana
    restart: unless-stopped
    
    ports:
      - "5601:5601"
    
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
    
    networks:
      - soc-network
    
    depends_on:
      - elasticsearch
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ===========================================================================
  # MESSAGE BROKER - RabbitMQ
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: soc-rabbitmq
    restart: unless-stopped
    
    ports:
      - "5672:5672"
      - "15672:15672"
    
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-admin}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-admin123}"
    
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    
    networks:
      - soc-network
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ===========================================================================
  # SERVICE DISCOVERY - Consul
  # ===========================================================================
  consul:
    image: consul:1.15
    container_name: soc-consul
    restart: unless-stopped
    
    ports:
      - "8500:8500"
    
    command: consul agent -dev -client=0.0.0.0
    
    volumes:
      - consul_data:/consul/data
    
    networks:
      - soc-network
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ===========================================================================
  # LOAD BALANCER - Nginx
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: soc-nginx
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    
    networks:
      - soc-network
    
    depends_on:
      - soc-engine
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
  rabbitmq_data:
    driver: local
  consul_data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  soc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
