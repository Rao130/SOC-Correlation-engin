<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a73e8">
    
    <title>SOC Mobile - Real-time Security Alerts</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16x16.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <style>
        .alert-card {
            transition: all 0.3s ease;
            transform: translateY(0);
        }
        .alert-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .pulse-dot {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        .slide-in {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .critical-alert {
            animation: criticalPulse 1s infinite;
        }
        @keyframes criticalPulse {
            0% { background-color: #ef4444; }
            50% { background-color: #dc2626; }
            100% { background-color: #ef4444; }
        }
        .status-online { color: #10b981; }
        .status-offline { color: #ef4444; }
        .status-warning { color: #f59e0b; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                <h1 class="text-xl font-bold">SOC Mobile</h1>
            </div>
            <div class="flex items-center space-x-4">
                <div id="connectionStatus" class="flex items-center">
                    <span class="pulse-dot w-2 h-2 bg-green-400 rounded-full mr-2"></span>
                    <span class="text-sm">Connected</span>
                </div>
                <button id="menuBtn" class="p-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-4 pb-20">
        <!-- Quick Stats -->
        <section class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-lg p-4 shadow-md">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Critical</p>
                        <p id="criticalCount" class="text-2xl font-bold text-red-600">0</p>
                    </div>
                    <svg class="w-8 h-8 text-red-600" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
                    </svg>
                </div>
            </div>
            <div class="bg-white rounded-lg p-4 shadow-md">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">High</p>
                        <p id="highCount" class="text-2xl font-bold text-orange-600">0</p>
                    </div>
                    <svg class="w-8 h-8 text-orange-600" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                    </svg>
                </div>
            </div>
            <div class="bg-white rounded-lg p-4 shadow-md">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Medium</p>
                        <p id="mediumCount" class="text-2xl font-bold text-yellow-600">0</p>
                    </div>
                    <svg class="w-8 h-8 text-yellow-600" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                    </svg>
                </div>
            </div>
            <div class="bg-white rounded-lg p-4 shadow-md">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">Total</p>
                        <p id="totalCount" class="text-2xl font-bold text-blue-600">0</p>
                    </div>
                    <svg class="w-8 h-8 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                    </svg>
                </div>
            </div>
        </section>

        <!-- Alert Filters -->
        <section class="bg-white rounded-lg p-4 shadow-md mb-6">
            <div class="flex flex-wrap gap-2 items-center">
                <button class="filter-btn px-4 py-2 rounded-full bg-blue-600 text-white text-sm" data-filter="all">
                    All
                </button>
                <button class="filter-btn px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-sm" data-filter="critical">
                    Critical
                </button>
                <button class="filter-btn px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-sm" data-filter="high">
                    High
                </button>
                <button class="filter-btn px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-sm" data-filter="medium">
                    Medium
                </button>
                <button class="filter-btn px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-sm" data-filter="low">
                    Low
                </button>
            </div>
        </section>

        <!-- Real-time Alerts -->
        <section class="mb-6">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Real-time Alerts</h2>
            <div id="alertsContainer" class="space-y-4">
                <!-- Alerts will be inserted here -->
                <div class="text-center text-gray-500 py-8">
                    <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                    </svg>
                    <p>No alerts yet. Waiting for real-time updates...</p>
                </div>
            </div>
        </section>

        <!-- System Status -->
        <section class="bg-white rounded-lg p-4 shadow-md">
            <h2 class="text-xl font-bold mb-4 text-gray-800">System Status</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded">
                    <span class="text-sm font-medium">API Status</span>
                    <span id="apiStatus" class="status-online text-sm font-bold">● Online</span>
                </div>
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded">
                    <span class="text-sm font-medium">WebSocket</span>
                    <span id="wsStatus" class="status-offline text-sm font-bold">● Offline</span>
                </div>
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded">
                    <span class="text-sm font-medium">Last Update</span>
                    <span id="lastUpdate" class="text-sm text-gray-600">Never</span>
                </div>
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded">
                    <span class="text-sm font-medium">Alert Rate</span>
                    <span id="alertRate" class="text-sm text-gray-600">0/min</span>
                </div>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200">
        <div class="grid grid-cols-4 py-2">
            <button class="flex flex-col items-center py-2 text-blue-600" onclick="showSection('alerts')">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
                </svg>
                <span class="text-xs mt-1">Alerts</span>
            </button>
            <button class="flex flex-col items-center py-2 text-gray-600" onclick="showSection('dashboard')">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
                </svg>
                <span class="text-xs mt-1">Dashboard</span>
            </button>
            <button class="flex flex-col items-center py-2 text-gray-600" onclick="showSection('analytics')">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
                </svg>
                <span class="text-xs mt-1">Analytics</span>
            </button>
            <button class="flex flex-col items-center py-2 text-gray-600" onclick="showSection('settings')">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-1.77-.7-3.29-1.69-4.24-.26-.2-.42-.52-.42-.88 0-.36.14-.68.42-.88 1.02-.98 1.69-2.47 1.69-4.24 0-.33-.02-.65-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.29-.06.61-.06.94 0 1.77.7 3.29 1.69 4.24.26.2.42.52.42.88 0 .36-.14.68-.42.88-1.02.98-1.69 2.47-1.69 4.24 0 .33.02.65.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
                <span class="text-xs mt-1">Settings</span>
            </button>
        </div>
    </nav>

    <!-- Alert Detail Modal -->
    <div id="alertModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden">
        <div class="bg-white rounded-lg p-6 m-4 max-w-lg slide-in">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold">Alert Details</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div id="modalContent">
                <!-- Modal content will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let socket;
        let alerts = [];
        let currentFilter = 'all';
        let alertCounts = { critical: 0, high: 0, medium: 0, low: 0 };
        
        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
            requestNotificationPermission();
        });
        
        function initializeApp() {
            // Initialize WebSocket connection
            connectWebSocket();
            
            // Set up filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    setFilter(this.dataset.filter);
                });
            });
            
            // Load initial alerts
            loadRecentAlerts();
            
            // Update stats every 30 seconds
            setInterval(updateStats, 30000);
        }
        
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/alerts`;
            
            socket = io(wsUrl);
            
            socket.on('connect', function() {
                console.log('WebSocket connected');
                updateConnectionStatus(true);
                document.getElementById('wsStatus').textContent = '● Online';
                document.getElementById('wsStatus').className = 'status-online text-sm font-bold';
            });
            
            socket.on('disconnect', function() {
                console.log('WebSocket disconnected');
                updateConnectionStatus(false);
                document.getElementById('wsStatus').textContent = '● Offline';
                document.getElementById('wsStatus').className = 'status-offline text-sm font-bold';
            });
            
            socket.on('new_alert', function(alert) {
                console.log('New alert received:', alert);
                addAlert(alert);
                showNotification(alert);
                updateStats();
            });
            
            socket.on('alert_update', function(alert) {
                updateAlert(alert);
                updateStats();
            });
        }
        
        function loadRecentAlerts() {
            fetch('/api/alerts?limit=20')
                .then(response => response.json())
                .then(data => {
                    if (data.alerts) {
                        data.alerts.forEach(alert => addAlert(alert));
                        updateStats();
                    }
                })
                .catch(error => console.error('Error loading alerts:', error));
        }
        
        function addAlert(alert) {
            // Check if alert already exists
            if (alerts.find(a => a._id === alert._id)) {
                return;
            }
            
            alerts.unshift(alert);
            alertCounts[alert.severity] = (alertCounts[alert.severity] || 0) + 1;
            
            if (shouldShowAlert(alert)) {
                renderAlert(alert);
            }
        }
        
        function updateAlert(alert) {
            const index = alerts.findIndex(a => a._id === alert._id);
            if (index !== -1) {
                alerts[index] = { ...alerts[index], ...alert };
                refreshAlertDisplay();
            }
        }
        
        function renderAlert(alert) {
            const container = document.getElementById('alertsContainer');
            
            // Remove "no alerts" message if present
            const noAlertsMsg = container.querySelector('.text-center');
            if (noAlertsMsg) {
                noAlertsMsg.remove();
            }
            
            const severityColors = {
                critical: 'bg-red-100 border-red-500 text-red-900',
                high: 'bg-orange-100 border-orange-500 text-orange-900',
                medium: 'bg-yellow-100 border-yellow-500 text-yellow-900',
                low: 'bg-blue-100 border-blue-500 text-blue-900'
            };
            
            const alertCard = document.createElement('div');
            alertCard.className = `alert-card bg-white rounded-lg shadow-md border-l-4 p-4 ${severityColors[alert.severity]}`;
            alertCard.dataset.alertId = alert._id;
            
            alertCard.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <h3 class="font-bold text-lg">${alert.title}</h3>
                    <span class="text-xs font-semibold uppercase px-2 py-1 rounded">${alert.severity}</span>
                </div>
                <p class="text-gray-700 mb-3">${alert.description}</p>
                <div class="flex justify-between items-center text-sm text-gray-500">
                    <span><i class="fas fa-clock mr-1"></i>${formatTime(alert.timestamp)}</span>
                    <button onclick="showAlertDetails('${alert._id}')" class="text-blue-600 hover:text-blue-800">
                        View Details
                    </button>
                </div>
            `;
            
            container.insertBefore(alertCard, container.firstChild);
        }
        
        function refreshAlertDisplay() {
            const container = document.getElementById('alertsContainer');
            container.innerHTML = '';
            
            const filteredAlerts = alerts.filter(alert => shouldShowAlert(alert));
            filteredAlerts.forEach(alert => renderAlert(alert));
            
            if (filteredAlerts.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-gray-500 py-8">
                        <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                        </svg>
                        <p>No alerts found for the selected filter.</p>
                    </div>
                `;
            }
        }
        
        function shouldShowAlert(alert) {
            if (currentFilter === 'all') return true;
            return alert.severity === currentFilter;
        }
        
        function setFilter(filter) {
            currentFilter = filter;
            
            // Update button styles
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.filter === filter) {
                    btn.className = 'filter-btn px-4 py-2 rounded-full bg-blue-600 text-white text-sm';
                } else {
                    btn.className = 'filter-btn px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-sm';
                }
            });
            
            refreshAlertDisplay();
        }
        
        function updateStats() {
            document.getElementById('criticalCount').textContent = alertCounts.critical || 0;
            document.getElementById('highCount').textContent = alertCounts.high || 0;
            document.getElementById('mediumCount').textContent = alertCounts.medium || 0;
            document.getElementById('totalCount').textContent = alerts.length;
            
            // Update last update time
            document.getElementById('lastUpdate').textContent = formatTime(new Date());
            
            // Calculate alert rate (alerts per minute in last hour)
            const oneHourAgo = new Date(Date.now() - 60 * 60 * 1000);
            const recentAlerts = alerts.filter(alert => new Date(alert.timestamp) > oneHourAgo);
            const alertRate = (recentAlerts.length / 60).toFixed(1);
            document.getElementById('alertRate').textContent = `${alertRate}/min`;
        }
        
        function updateConnectionStatus(connected) {
            const statusElement = document.getElementById('connectionStatus');
            if (connected) {
                statusElement.innerHTML = `
                    <span class="pulse-dot w-2 h-2 bg-green-400 rounded-full mr-2"></span>
                    <span class="text-sm">Connected</span>
                `;
            } else {
                statusElement.innerHTML = `
                    <span class="w-2 h-2 bg-red-400 rounded-full mr-2"></span>
                    <span class="text-sm">Disconnected</span>
                `;
            }
        }
        
        function showAlertDetails(alertId) {
            const alert = alerts.find(a => a._id === alertId);
            if (!alert) return;
            
            const modal = document.getElementById('alertModal');
            const modalContent = document.getElementById('modalContent');
            
            modalContent.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <h4 class="font-semibold text-gray-700">Title</h4>
                        <p>${alert.title}</p>
                    </div>
                    <div>
                        <h4 class="font-semibold text-gray-700">Severity</h4>
                        <span class="px-2 py-1 rounded text-sm font-semibold uppercase bg-${getSeverityColor(alert.severity)}-100 text-${getSeverityColor(alert.severity)}-900">
                            ${alert.severity}
                        </span>
                    </div>
                    <div>
                        <h4 class="font-semibold text-gray-700">Description</h4>
                        <p>${alert.description}</p>
                    </div>
                    <div>
                        <h4 class="font-semibold text-gray-700">Source</h4>
                        <p>${alert.source}</p>
                    </div>
                    <div>
                        <h4 class="font-semibold text-gray-700">Timestamp</h4>
                        <p>${formatTime(alert.timestamp)}</p>
                    </div>
                    <div>
                        <h4 class="font-semibold text-gray-700">Actions</h4>
                        <div class="flex space-x-2">
                            <button onclick="acknowledgeAlert('${alert._id}')" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                                Acknowledge
                            </button>
                            <button onclick="assignAlert('${alert._id}')" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">
                                Assign
                            </button>
                            <button onclick="escalateAlert('${alert._id}')" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">
                                Escalate
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            modal.classList.remove('hidden');
        }
        
        function closeModal() {
            document.getElementById('alertModal').classList.add('hidden');
        }
        
        function acknowledgeAlert(alertId) {
            // Implement acknowledge functionality
            console.log('Acknowledging alert:', alertId);
            closeModal();
        }
        
        function assignAlert(alertId) {
            // Implement assign functionality
            console.log('Assigning alert:', alertId);
            closeModal();
        }
        
        function escalateAlert(alertId) {
            // Implement escalate functionality
            console.log('Escalating alert:', alertId);
            closeModal();
        }
        
        function showSection(section) {
            // Implement navigation between sections
            console.log('Showing section:', section);
        }
        
        function getSeverityColor(severity) {
            const colors = {
                critical: 'red',
                high: 'orange',
                medium: 'yellow',
                low: 'blue'
            };
            return colors[severity] || 'gray';
        }
        
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString();
        }
        
        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission().then(permission => {
                    console.log('Notification permission:', permission);
                });
            }
        }
        
        function showNotification(alert) {
            if ('Notification' in window && Notification.permission === 'granted') {
                const notification = new Notification(`SOC Alert: ${alert.title}`, {
                    body: alert.description,
                    icon: '/static/mobile/icons/icon-192x192.png',
                    badge: '/static/mobile/icons/icon-192x192.png',
                    tag: alert._id,
                    requireInteraction: true
                });
                
                notification.onclick = function() {
                    window.focus();
                    showAlertDetails(alert._id);
                    notification.close();
                };
                
                // Auto-close after 10 seconds
                setTimeout(() => {
                    notification.close();
                }, 10000);
            }
        }
        
        // Check API status
        function checkAPIStatus() {
            fetch('/health')
                .then(response => response.json())
                .then(data => {
                    const statusElement = document.getElementById('apiStatus');
                    if (data.status === 'healthy') {
                        statusElement.textContent = '● Online';
                        statusElement.className = 'status-online text-sm font-bold';
                    } else {
                        statusElement.textContent = '● Error';
                        statusElement.className = 'status-warning text-sm font-bold';
                    }
                })
                .catch(error => {
                    document.getElementById('apiStatus').textContent = '● Offline';
                    document.getElementById('apiStatus').className = 'status-offline text-sm font-bold';
                });
        }
        
        // Check API status every 30 seconds
        setInterval(checkAPIStatus, 30000);
        checkAPIStatus();
    </script>
</body>
</html>
